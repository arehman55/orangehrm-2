[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orangehrm-rpa-automation"
version = "1.0.0"
description = "Enterprise RPA Automation Suite for OrangeHRM and Mozilla Thunderbird"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Abdul Rehman", email = "abdulrehmanlhr55@gmail.com" }
]
dependencies = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "robotframework>=6.1.0",
    "rpaframework>=28.0.0",
    "python-xlib>=0.33",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "msoffcrypto-tool>=5.4.2",
    "PyYAML>=6.0.1",
    "allure-robotframework>=2.13.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
# Centralized CLI commands available after package installation.
run-rpa = "src.cli:main"

[tool.setuptools]
# Register the src packages so existing imports (src.pages...) continue to work.
packages = [
    "src",
    "src.pages",
    "src.keywords",
    "src.mixins",
    "src.services",
]
include-package-data = true