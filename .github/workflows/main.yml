name: OrangeHRM RPA Automation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v

  browser-regression:
    name: Robot regression (${{ matrix.browser }})
    if: ${{ secrets.ORANGEHRM_PASSWORD != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      ORANGEHRM_BASE_URL: ${{ vars.ORANGEHRM_BASE_URL || 'https://opensource-demo.orangehrmlive.com/web/index.php/auth/login' }}
      ORANGEHRM_USER: ${{ secrets.ORANGEHRM_USER || 'Admin' }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-only-unused-legacy-key' }}
      BROWSER: ${{ matrix.browser }}
      HEADLESS: "true"
      RUN_EMAIL: "false"
      ROBOT_OUTPUT_DIR: output/${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m src.cli --mode robot
        env:
          ROBOT_RETRIES: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-report-${{ matrix.browser }}
          path: output/${{ matrix.browser }}/
          if-no-files-found: warn
